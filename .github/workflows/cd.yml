name: CD - Neptun-Stream
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Download repository code
            - uses: actions/checkout@v3
            # Deploy via SSH
            - uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                    # Update package index and install dependencies
                    sudo dnf update -y
                    sudo dnf install docker

                    # Install Docker
                    sudo dnf install docker

                    # Add the SSH user to the Docker group
                    sudo usermod -aG docker ${{ secrets.SSH_USERNAME }}

                    # Install Docker Compose
                    sudo dnf install -y docker-compose-plugin
                    docker compose up -d

                    # Verify installations
                    docker --version
                    docker compose --version

                    # Navigate to the project directory and deploy
                    cd /home/ubuntu/
                    git clone git@github.com:aizhanmaksatbek/neptun-stream.git
                    cd neptun-stream
                    git fetch origin main
                    git reset --hard origin/main
                    docker-compose up -d --build