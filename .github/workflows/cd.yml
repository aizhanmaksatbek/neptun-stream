name: CD - Neptun-Stream
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Download repository code
            - uses: actions/checkout@v3
            # Deploy via SSH
            - uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                    # Update package index and install dependencies
                    sudo rm -rf /usr/local/lib/docker/cli-plugins/*
                    sudo dnf update -y
                    sudo dnf install git -y
                    sudo dnf install docker -y

                    # Verify installations
                    docker --version

                    sudo usermod -aG docker ${{ secrets.SSH_USERNAME }}

                    # Install Docker Compose
                    sudo systemctl start docker
                    sudo systemctl enable docker

                    # Install Docker Compose
                    sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                    sudo chmod +x /usr/local/bin/docker-compose

                    # Verify installations
                    docker compose version

                    # Navigate to the project directory and deploy
                    cd /home/ec2-user/
                    if [ ! -d "neptun-stream" ]; then
                        git clone https://github.com/aizhanmaksatbek/neptun-stream.git
                    fi
                    cd neptun-stream
                    git fetch origin main
                    git reset --hard origin/main
                    docker compose up --build