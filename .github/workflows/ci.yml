name: CI - Neptun-Stream

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # Download repository code
            - uses: actions/checkout@v4
            # Install python
            - uses: actions/setup-python@v5
              with:
                python-version: "3.10"
            # Install dependencies
            - run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            # Run tests
            - run: |
                pytest
            # Checks code style - Linting
            - run: |
                flake8 .
            #  Formatting check
            - run: |
                black --check .
            # Type checking
            - run: |
                mypy .