{% extends "layout.html" %}
{% block content %}
  {% for article in articles %}
    <article class="content-section py-3 px-4 mb-4">
      <div class="d-flex align-items-start gap-4">
        <img class="rounded-circle article-img flex-shrink-0"
             src="{{ url_for('static', path='profile_pics/default.jpg') }}"
             alt="{{ article.author }}'s profile picture"
             width="64"
             height="64"
             loading="lazy">
        <div class="flex-grow-1">
          <div class="article-metadata mb-2">
            <a class="me-2" href="#">{{ article.author }}</a>
            <small class="text-body-secondary">{{ article.date_articleed }}</small>
          </div>
          <h2>
            <a class="article-title" href="#">{{ article.title }}</a>
          </h2>
          <p class="article-content">{{ article.content }}</p>
        </div>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
